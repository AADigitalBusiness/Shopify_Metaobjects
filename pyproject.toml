[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-metaobjects"
version = "0.2.0"
description = "Reusable Shopify Metaobjects client with injectable GraphQL transport"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
standalone = ["requests>=2.25.0", "tenacity>=8.0"]
csv = ["pandas>=1.0.0"]
django = []
dev = ["pytest>=7.0", "requests>=2.25.0", "tenacity>=8.0", "pandas>=1.0.0"]

[project.urls]
Repository = "https://github.com/aavendano/Shopify_Metaobjects"

[tool.setuptools.packages.find]
where = ["."]
include = ["shopify_metaobjects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
